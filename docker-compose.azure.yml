services:
  nginx:
    image: nginx:1.28-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/azure.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend
    networks:
      - frontend_net
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      MONGO_URI: mongodb://mongo:27017/cloudshield
    depends_on:
      - mongo
    networks:
      - frontend_net
      - database_net
    restart: unless-stopped

  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    networks:
      - database_net
    restart: unless-stopped

networks:
  frontend_net:
  database_net:
    internal: true

volumes:
  mongo_data:
